name: Server test

on:
  push:
    paths:
      - 'server/**'
      - '.github/workflows/server-test.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/server-test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pasang dependensi server
        run: npm install --no-audit --no-fund

      - name: Test dan verifikasi coverage minimal 80%
        run: npm test
